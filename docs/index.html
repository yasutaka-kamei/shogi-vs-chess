<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>将棋 vs チェス</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%9A%3C/text%3E%3C/svg%3E">
  <style>
    :root { --bg: #f4efe6; --ink: #2b2420; --muted: #7a6f66; --line: #d9cfc2; --accent: #b5452b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
      background: var(--bg); color: var(--ink);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px 28px 22px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    h1 { margin: 0 0 4px; font-size: 1.4rem; letter-spacing: 0.05em; }
    h1 .vs { color: var(--accent); font-size: 0.85em; margin: 0 4px; }
    p { margin: 0 0 16px; color: var(--muted); font-size: 0.9rem; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input[type=password] { width: 100%; font: inherit; font-size: 1.1rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
    input[type=password]:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
    .remember { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--muted); margin: 0; }
    button { font: inherit; background: var(--accent); color: #fff; border: 1px solid var(--accent); border-radius: 10px; padding: 10px 18px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    .error { color: var(--accent); font-size: 0.9rem; min-height: 1.4em; margin-top: 10px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <h1>将棋 <span class="vs">vs</span> チェス</h1>
    <p>合言葉を入力してください</p>
    <label for="pw">合言葉</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus>
    <div class="row">
      <label class="remember"><input type="checkbox" id="remember" checked> この端末で覚える</label>
      <button type="submit" id="btn">入る</button>
    </div>
    <div class="error" id="error"></div>
  </form>

  <script>
  (function () {
    'use strict';
    var STORAGE_KEY = 'svc-passphrase';
    var payload = JSON.parse(document.getElementById('payload').textContent);
    var form = document.getElementById('form');
    var pwInput = document.getElementById('pw');
    var remember = document.getElementById('remember');
    var btn = document.getElementById('btn');
    var errorEl = document.getElementById('error');

    function b64(s) {
      var bin = atob(s), out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    function concat(a, b) {
      var out = new Uint8Array(a.length + b.length);
      out.set(a, 0); out.set(b, a.length);
      return out;
    }

    async function decrypt(password) {
      var subtle = window.crypto && window.crypto.subtle;
      if (!subtle) throw new Error('nocrypto');
      var enc = new TextEncoder();
      var base = await subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
      var bits = new Uint8Array(await subtle.deriveBits(
        { name: 'PBKDF2', hash: 'SHA-256', salt: b64(payload.salt), iterations: payload.iter }, base, 512));
      var aesKey = await subtle.importKey('raw', bits.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
      var macKey = await subtle.importKey('raw', bits.slice(32, 64), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
      var iv = b64(payload.iv), ct = b64(payload.ct);
      var ok = await subtle.verify('HMAC', macKey, b64(payload.mac), concat(iv, ct));
      if (!ok) throw new Error('badpassword');
      var plain = await subtle.decrypt({ name: 'AES-CBC', iv: iv }, aesKey, ct);
      return new TextDecoder().decode(plain);
    }

    async function unlock(password, save) {
      btn.disabled = true;
      errorEl.textContent = '';
      try {
        var html = await decrypt(password);
        try {
          if (save) localStorage.setItem(STORAGE_KEY, password);
          else localStorage.removeItem(STORAGE_KEY);
        } catch (e) { /* ignore */ }
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        if (e && e.message === 'nocrypto') errorEl.textContent = 'このブラウザでは開けません（HTTPSで開いてください）';
        else errorEl.textContent = '合言葉が違います';
        try { localStorage.removeItem(STORAGE_KEY); } catch (e2) { /* ignore */ }
        btn.disabled = false;
        pwInput.focus();
        pwInput.select();
      }
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var pw = pwInput.value;
      if (!pw) { pwInput.focus(); return; }
      unlock(pw, remember.checked);
    });

    var saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) { /* ignore */ }
    if (saved) { pwInput.value = saved; unlock(saved, true); }
  })();
  </script>
